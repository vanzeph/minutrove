name: Native checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true

jobs:
  checks:
    name: Format, analyze, unit and widget tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        run: |
          bash tool/install_flutter.sh "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: bash tool/check.sh

  android:
    name: Android development APK and unsigned AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - name: Verify Java runtime
        run: java -XshowSettings:properties -version 2>&1 | grep -F 'java.runtime.version = 17.0.20.1+1'
      - name: Install pinned Flutter and Android components
        run: |
          bash tool/install_flutter.sh "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Build and verify Android outputs
        run: bash tool/build_native.sh android
      - name: Retain metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-evidence-${{ github.sha }}
          path: build/evidence/android.json
          if-no-files-found: error
          retention-days: 30

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify native Android sound loading and single playback
        timeout-minutes: 10
        run: |
          flutter pub get --enforce-lockfile
          bash tool/test_android_chime.sh

  ios:
    name: iOS simulator app and unsigned device archive
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Xcode and install pinned Flutter
        run: |
          test "$(xcodebuild -version | head -1)" = 'Xcode 16.4'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '18.5'
          bash tool/install_flutter.sh "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build and verify unsigned iOS outputs
        run: bash tool/build_native.sh ios
      - name: Retain metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-evidence-${{ github.sha }}
          path: build/evidence/ios.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify native iOS sound loading and single playback
        timeout-minutes: 10
        run: |
          flutter build ios --simulator --debug --config-only
          bash tool/test_ios_chime.sh

  integration-ios:
    name: iOS simulator integration
    # Isolate simulator memory from the archive build; this standard runner has 14 GB.
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Xcode and install pinned Flutter
        run: |
          test "$(xcodebuild -version | head -1)" = 'Xcode 16.4'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '18.5'
          bash tool/install_flutter.sh "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare iOS test dependencies before booting the simulator
        run: |
          flutter precache --ios
          python3 tool/verify_toolchain.py
          flutter pub get --enforce-lockfile
      - name: Run native integration tests on iPhone 16 / iOS 18.5
        timeout-minutes: 15
        run: |
          device=$(xcrun simctl create Minutrove-CI com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          trap 'xcrun simctl shutdown "$device"; xcrun simctl delete "$device"' EXIT
          xcrun simctl boot "$device"
          open -a Simulator --args -CurrentDeviceUDID "$device"
          xcrun simctl bootstatus "$device" -b
          bash tool/integration.sh "$device"
          echo 'Native integration tests passed on iPhone 16 / iOS 18.5. Physical-device acceptance remains separate.' >> "$GITHUB_STEP_SUMMARY"
