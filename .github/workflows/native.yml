name: Native checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FLUTTER_SUPPRESS_ANALYTICS: true

jobs:
  checks:
    name: Format, analyze, unit and widget tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        run: |
          bash tool/install_flutter.sh "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: bash tool/check.sh

  android:
    name: Android development APK and unsigned AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # Adoptium's SemVer selector for JDK 17.0.20.1+1.
          java-version: '17.0.20+101'
      - name: Verify Java runtime
        run: java -XshowSettings:properties -version 2>&1 | grep -E '^ *java.runtime.version = 17\.0\.20\.1\+1$'
      - name: Install pinned Flutter and Android components
        run: |
          bash tool/install_flutter.sh "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Build and verify Android outputs
        run: bash tool/build_native.sh android
      - name: Retain metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-evidence-${{ github.sha }}
          path: build/evidence/android.json
          if-no-files-found: error
          retention-days: 30

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify native Android sound loading and single playback
        timeout-minutes: 10
        run: |
          flutter pub get --enforce-lockfile
          bash tool/test_android_chime.sh

  ios:
    name: iOS simulator app and unsigned device archive
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Xcode and install pinned Flutter
        run: |
          test "$(xcodebuild -version | head -1)" = 'Xcode 16.4'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '18.5'
          bash tool/install_flutter.sh "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build and verify unsigned iOS outputs
        run: bash tool/build_native.sh ios
      - name: Retain metadata only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build-evidence-${{ github.sha }}
          path: build/evidence/ios.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify native iOS sound loading and single playback
        timeout-minutes: 10
        run: |
          flutter build ios --simulator --debug --config-only
          bash tool/test_ios_chime.sh

  integration-ios:
    name: iOS simulator integration (${{ matrix.name }})
    # XCTest drives the Dart suite without a Flutter CLI debug-service
    # connection. The matrix legs are the OS versions the macos-15 image
    # genuinely provides runtimes for: the pinned toolchain (Xcode 16.4 /
    # iPhone 16 / iOS 18.5) and the newest installed major (Xcode 26.3 /
    # iPhone 17 / iOS 26.2). Each leg also runs the native RunnerTests
    # suite so UserNotifications and chime behavior is observed per OS.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone 16 / iOS 18.5
            xcode: '16.4'
            sdk: '18.5'
            runtime: iOS-18-5
            devicetype: iPhone-16
          - name: iPhone 17 / iOS 26.2
            xcode: '26.3'
            sdk: '26.2'
            runtime: iOS-26-2
            devicetype: iPhone-17
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      MINUTROVE_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.${{ matrix.runtime }}
      MINUTROVE_IOS_DEVICETYPE: com.apple.CoreSimulator.SimDeviceType.${{ matrix.devicetype }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify Xcode and install pinned Flutter
        run: |
          test "$(xcodebuild -version | head -1)" = 'Xcode ${{ matrix.xcode }}'
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = '${{ matrix.sdk }}'
          test "$(xcrun simctl list runtimes | grep -c '${{ matrix.runtime }}')" -ge 1
          bash tool/install_flutter.sh "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Run native integration tests through XCTest
        timeout-minutes: 20
        run: |
          flutter precache --ios
          bash tool/integration_ios.sh
          echo 'Dart integration tests and native RunnerTests passed through XCTest on ${{ matrix.name }} (Xcode ${{ matrix.xcode }}). Physical-device acceptance remains separate.' >> "$GITHUB_STEP_SUMMARY"

  integration-android:
    name: Android emulator integration
    # The same Dart suite runs against the app's real on-device SQLite via the
    # platform sqflite channel; combined with the iOS job it proves backup
    # export/restore portability in both directions.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          # Adoptium's SemVer selector for JDK 17.0.20.1+1.
          java-version: '17.0.20+101'
      - name: Install pinned Flutter and Android components
        run: |
          bash tool/install_flutter.sh "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-33;google_apis;x86_64'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run native integration tests on the emulator
        timeout-minutes: 25
        run: |
          bash tool/integration_android.sh
          echo 'Dart integration tests passed on Android 13 (API 33) x86_64 emulator. Physical-device acceptance remains separate.' >> "$GITHUB_STEP_SUMMARY"
