name: minutrove
description: A local quest-and-award app for iOS and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '3.13.2'
  flutter: '3.47.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/licenses/
  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
